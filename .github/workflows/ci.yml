name: CI

# Builds and tests on every push. It deliberately does not gate on performance: a hosted
# runner is a different machine every time, and a figure only means something against the
# desk it was measured on. The gate is run-perf-gate.cmd, on the machine that took its
# baseline, and release.cmd runs it before it archives (QS79). A runner that is always the
# same machine is what would move it here.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Quickshell.sln

      - name: Build
        run: dotnet build Quickshell.sln --configuration Release --no-restore -warnaserror

      # run-tests.cmd, which is the suite on every desk: it writes a TRX per assembly and names a
      # red run's tests. `dotnet test --solution Quickshell.sln` gives the same verdict since QS89.
      #
      # A hosted Windows runner cannot run the Linux SSH fixture, and says so: the network tests are
      # printed as waived rather than passing as a quieter green, and every other skip is held to
      # tests\skips.json (QS136).
      - name: Test
        env:
          QUICKSHELL_NO_FIXTURE: "1"
        run: .\run-tests.cmd Release

      # What a release ships, built the way a release builds it (QS193): self-contained, ReadyToRun,
      # zipped. A publish fails for reasons a build never meets - a runtime pack that will not
      # restore, a ReadyToRun compile error, a property the SDK refuses for WPF - and this is where
      # those surface, on the push that caused them rather than on the day of a release.
      #
      # Unsigned, because the certificate is the maintainer's and the archive's name says so. Ungated,
      # because the performance gate means something only on the desk that took its baseline, which a
      # hosted runner never is - the header above says the same.
      - name: Release archive (unsigned)
        run: .\release.cmd -Unsigned -Ungated

      - name: Keep the archive
        uses: actions/upload-artifact@v7
        with:
          name: quickshell-unsigned
          path: artifacts/release/
          retention-days: 5
          if-no-files-found: error
