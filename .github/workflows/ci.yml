name: CI

# Builds and tests on every push. It deliberately does not yet gate on performance: there
# is nothing to measure until the harness exists, and the pipeline is here now so that
# adding that step later is a step and not a project.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Quickshell.sln

      - name: Build
        run: dotnet build Quickshell.sln --configuration Release --no-restore -warnaserror

      # run-tests.cmd and not `dotnet test`: that command reports "zero tests ran" and exits 5 on
      # a tree where every assembly passes, so a pipeline gated on it is gated on nothing.
      - name: Test
        run: .\run-tests.cmd Release
