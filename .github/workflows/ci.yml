name: CI

# Builds and tests on every push. It deliberately does not gate on performance: a hosted
# runner is a different machine every time, and a figure only means something against the
# desk it was measured on. The gate is run-perf-gate.cmd, on the machine that took its
# baseline, and release.cmd runs it before it archives (QS79). A runner that is always the
# same machine is what would move it here.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Quickshell.sln

      - name: Build
        run: dotnet build Quickshell.sln --configuration Release --no-restore -warnaserror

      # run-tests.cmd and not `dotnet test`: that command reports "zero tests ran" and exits 5 on
      # a tree where every assembly passes, so a pipeline gated on it is gated on nothing.
      - name: Test
        run: .\run-tests.cmd Release
