<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>quickshell connected session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5b3fd6}a:hover{color:#4a30bd}
.qs-ghost:hover{background:rgba(20,16,42,0.06)}
.qs-rail:hover{background:rgba(20,16,42,0.06)}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #f8f7fd; color: #14102a; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; font-size: 14px; overflow: hidden; border: 1px solid #ded9f0">

  <!-- Title bar -->
  <div style="height: 40px; flex-shrink: 0; display: flex; align-items: center; padding-left: 14px; gap: 10px">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M7 9l3 3-3 3"></path><path d="M12 15h5"></path></svg>
    <span style="font-size: 12px; color: #4c4668">db-primary — quickshell</span>
    <div style="flex-grow: 1"></div>
    <div style="display: flex">
      <button aria-label="Minimise" class="qs-ghost" style="width: 46px; height: 40px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="#14102a" stroke-width="1"></path></svg></button>
      <button aria-label="Maximise" class="qs-ghost" style="width: 46px; height: 40px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="#14102a" stroke-width="1"></rect></svg></button>
      <button aria-label="Close" class="qs-ghost" style="width: 46px; height: 40px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="#14102a" stroke-width="1"></path></svg></button>
    </div>
  </div>

  <!-- Tab strip -->
  <div style="height: 42px; flex-shrink: 0; display: flex; align-items: flex-end; padding: 0 12px; gap: 2px; border-bottom: 1px solid #ded9f0">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 0 16px; height: 38px; color: #4c4668; text-decoration: none">
      <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#4c4668" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>
      Home
    </a>
    <div style="position: relative; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; height: 38px; font-weight: 600">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #1a7f37"></span>
      db-primary
      <button aria-label="Close tab db-primary" class="qs-ghost" style="width: 22px; height: 22px; border: 0; border-radius: 4px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="8" height="8" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="#635c80" stroke-width="1.5"></path></svg></button>
      <div style="position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 2px; background: {{accent}}"></div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; height: 38px; color: #4c4668">
      <span style="width: 8px; height: 8px; border-radius: 4px; border: 1.5px solid #8b949e; box-sizing: border-box"></span>
      PowerShell
      <button aria-label="Close tab PowerShell" class="qs-ghost" style="width: 22px; height: 22px; border: 0; border-radius: 4px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="8" height="8" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="#635c80" stroke-width="1.5"></path></svg></button>
    </div>
    <button aria-label="New tab" class="qs-ghost" style="margin-bottom: 5px; width: 30px; height: 28px; border: 0; border-radius: 6px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#4c4668" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>

  <div style="flex-grow: 1; display: flex; min-height: 0">

    <!-- Collapsed sessions rail -->
    <div style="width: 52px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 10px; background: #efedf9; border-right: 1px solid #ded9f0">
      <button aria-label="Show sessions" class="qs-rail" style="width: 36px; height: 36px; border: 0; border-radius: 6px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#4c4668" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg></button>
      <button aria-label="Files on this server" class="qs-rail" style="width: 36px; height: 36px; border: 0; border-radius: 6px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#4c4668" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg></button>
      <button aria-label="Tunnels" class="qs-rail" style="width: 36px; height: 36px; border: 0; border-radius: 6px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#4c4668" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h12"></path><path d="M12 6l6 6-6 6"></path><path d="M20 5v14"></path></svg></button>
    </div>

    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">

      <!-- Session bar -->
      <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #ded9f0; background: #ffffff">
        <div style="display: flex; flex-direction: column; line-height: 1.2">
          <span style="font-weight: 600">db-primary</span>
          <span style="font-size: 12px; color: #635c80; font-family: 'Cascadia Mono', Consolas, monospace">deploy@db1.example.com:2222 · via bastion</span>
        </div>
        <span style="font-size: 12px; padding: 2px 8px; border-radius: 5px; color: #1a7f37; background: rgba(26,127,55,0.12); border: 1px solid rgba(26,127,55,0.3)">Connected</span>
        <span style="font-size: 12px; padding: 2px 8px; border-radius: 5px; color: #4c4668; background: #f5f3fc; border: 1px solid #ded9f0">Forward 5432 → localhost:5432</span>
        <div style="flex-grow: 1"></div>
        <button class="qs-ghost" style="height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid #ded9f0; border-radius: 6px; background: #f8f7fd; font: inherit; font-size: 12px; color: #14102a">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#4c4668" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
          Files
        </button>
        <button class="qs-ghost" style="height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid #ded9f0; border-radius: 6px; background: #f8f7fd; font: inherit; font-size: 12px; color: #14102a">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#4c4668" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M12 4v16"></path></svg>
          Split
        </button>
        <button aria-label="More for this session" class="qs-ghost" style="width: 30px; height: 30px; border: 1px solid #ded9f0; border-radius: 6px; background: #f8f7fd; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="#4c4668"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
      </div>

      <!-- Terminal -->
      <div aria-label="Terminal output" style="flex-grow: 1; min-height: 0; background: {{ground}}; color: #e6e1fb; padding: 14px 18px; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 13.5px; line-height: 1.55; overflow: hidden">
        <sc-for list="{{lines}}" as="l" hint-placeholder-count="12">
          <div style="white-space: pre; color: {{l.color}}">{{l.text}}</div>
        </sc-for>
        <div style="white-space: pre"><span style="color: #7ee2a8">deploy@db1</span><span style="color: #8a82b3">:</span><span style="color: #9b87fc">~</span><span style="color: #e6e1fb">$ </span><span style="display: inline-block; width: 9px; height: 17px; vertical-align: -3px; background: #e6e1fb"></span></div>
      </div>
    </div>
  </div>

  <!-- Status bar -->
  <div style="height: 28px; flex-shrink: 0; display: flex; align-items: center; gap: 18px; padding: 0 14px; border-top: 1px solid #ded9f0; font-size: 12px; color: #635c80">
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 4px; background: #1a7f37"></span>Connected through bastion.example.com</span>
    <span>Reconnects after a drop</span>
    <div style="flex-grow: 1"></div>
    <span>UTF-8</span>
    <span>xterm-256color</span>
    <span>120 × 34</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5b3fd6","options":["#5b3fd6","#17699c","#b25334","#1a7f37"]},"ground":{"editor":"color","default":"#14102a","options":["#14102a","#0c0a1a","#1e1e1e","#fbfaff"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const out = '#e6e1fb';
    const dim = '#a9a2cc';
    return {
      accent: this.props.accent ?? '#5b3fd6',
      ground: this.props.ground ?? '#14102a',
      lines: [
        { text: 'Welcome to Ubuntu 24.04 LTS (GNU/Linux 6.8.0 x86_64)', color: out },
        { text: ' ', color: out },
        { text: 'Last login: from 10.0.4.12', color: dim },
        { text: 'deploy@db1:~$ systemctl status postgresql --no-pager | head -4', color: out },
        { text: '● postgresql.service - PostgreSQL RDBMS', color: '#7ee2a8' },
        { text: '     Loaded: loaded (/usr/lib/systemd/system/postgresql.service; enabled)', color: out },
        { text: '     Active: active (exited)', color: out },
        { text: '   Main PID: 1042 (code=exited, status=0/SUCCESS)', color: dim },
        { text: 'deploy@db1:~$ df -h /var/lib/postgresql', color: out },
        { text: 'Filesystem      Size  Used Avail Use% Mounted on', color: dim },
        { text: '/dev/nvme0n1p2  [SIZE] [USED] [AVAIL] [USE%] /', color: out },
        { text: 'deploy@db1:~$ psql -c "select 1"', color: out },
        { text: ' ?column?', color: out },
        { text: '----------', color: dim },
        { text: '        1', color: out },
        { text: '(1 row)', color: dim },
        { text: ' ', color: out }
      ]
    };
  }
}
</script>
</body>
</html>
