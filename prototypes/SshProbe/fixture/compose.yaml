# Two servers, because a jump host is not a jump host with one: the probe reaches `target` only
# through a channel opened on `jump`, and `target` publishes a port only so the direct answers
# have something to be compared against.
services:
  target:
    build: .
    container_name: qs-sshd-target
    # Its own name where a shell can see it: without this a container answers `hostname`
    # with a hex id, and a test asking the far end which machine it is gets nothing it
    # can check against.
    hostname: qs-sshd-target
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - ./keys:/keys:ro

  jump:
    build: .
    container_name: qs-sshd-jump
    # Its own name where a shell can see it: without this a container answers `hostname`
    # with a hex id, and a test asking the far end which machine it is gets nothing it
    # can check against.
    hostname: qs-sshd-jump
    ports:
      - "127.0.0.1:2223:22"
    volumes:
      - ./keys:/keys:ro

  # An old appliance, in the one respect that matters: it offers a key exchange modern clients
  # refuse. QS39 needs the "no algorithm in common" failure to come from a real server, because
  # that failure is the one most often met against hardware nobody can upgrade.
  legacy:
    build: .
    container_name: qs-sshd-legacy
    # Its own name where a shell can see it: without this a container answers `hostname`
    # with a hex id, and a test asking the far end which machine it is gets nothing it
    # can check against.
    hostname: qs-sshd-legacy
    ports:
      - "127.0.0.1:2224:22"
    volumes:
      - ./keys:/keys:ro
    command: ["legacy"]

  # An sshd with no sftp subsystem, which is the whole of what an old appliance is for QS63: a
  # server where the only way to move a file is scp over an exec channel.
  nosftp:
    build: .
    container_name: qs-sshd-nosftp
    hostname: qs-sshd-nosftp
    ports:
      - "127.0.0.1:2225:22"
    volumes:
      - ./keys:/keys:ro
    command: ["nosftp"]

  # A server that refuses forwarding outright, which is what a hardened estate looks like and the
  # refusal QS67 must report with the reason rather than as a generic failure.
  noforward:
    build: .
    container_name: qs-sshd-noforward
    hostname: qs-sshd-noforward
    ports:
      - "127.0.0.1:2226:22"
    volumes:
      - ./keys:/keys:ro
    command: ["noforward"]
